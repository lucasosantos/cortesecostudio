<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: media:; media-src 'self' blob: media:; worker-src 'self' blob:; connect-src 'self' blob: data: media: ws: http://localhost:*; font-src 'self' data:"
    />
    <title>CorteSeco Studio</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">CorteSeco<span> Studio</span></div>
      <div class="group">
        <button data-action="new" data-icon="new" class="icon" title="Novo projeto" aria-label="Novo projeto"></button>
        <button data-action="open" data-icon="open" class="icon" title="Abrir projeto (Ctrl+O)" aria-label="Abrir projeto"></button>
        <button data-action="save" data-icon="save" class="icon" title="Salvar projeto (Ctrl+S)" aria-label="Salvar projeto"></button>
      </div>
      <div class="group">
        <button data-action="undo" data-icon="undo" class="icon" title="Desfazer (Ctrl+Z)" aria-label="Desfazer"></button>
        <button data-action="redo" data-icon="redo" class="icon" title="Refazer (Ctrl+Shift+Z)" aria-label="Refazer"></button>
      </div>
      <div class="group">
        <button data-action="import" data-icon="media" class="icon" title="Mídia: importar vídeo, áudio ou imagem (Ctrl+I)" aria-label="Importar mídia"></button>
        <button data-action="add-text" data-icon="text" class="icon edit-only" title="Texto: adicionar no playhead (T)" aria-label="Adicionar texto"></button>
        <button data-action="new-comp" data-icon="comp" class="icon" title="Composição: nova composição de motion design" aria-label="Nova composição"></button>
        <button data-action="extensions" data-icon="keyframe" class="icon" title="Extensões: efeitos e transições (instalar, criar em código e compartilhar)" aria-label="Extensões"></button>
        <button data-action="ai" data-icon="sparkle" class="icon ai-btn" title="IA: conectar o Claude (ou outra IA via MCP) a este editor" aria-label="IA"></button>
        <button data-action="performance" data-icon="gauge" class="icon" title="Desempenho: qualidade do preview, placa de vídeo e arquivos proxy" aria-label="Desempenho"></button>
      </div>
      <div class="group mode-tabs">
        <button data-action="mode-edit" data-icon="edit" id="mode-edit" class="icon active" title="Edição: a timeline do vídeo" aria-label="Edição"></button>
        <button data-action="mode-motion" data-icon="motion" id="mode-motion" class="icon" title="Motion: o workspace de motion design" aria-label="Motion"></button>
      </div>
      <div class="spacer"></div>
      <button data-action="panels" data-icon="layout" id="panels-btn" class="icon" title="Painéis: mostrar, ocultar e mover as partes da interface" aria-label="Painéis"></button>
      <button class="settings-chip" data-action="settings" data-icon="settings" title="Dimensões e FPS do projeto"><span id="settings-label">1920×1080 · 30fps</span></button>
      <button class="primary icon" data-action="export" data-icon="export" title="Exportar (Ctrl+E)" aria-label="Exportar"></button>
    </header>

    <main class="workspace">
      <aside class="panel" id="media-panel"></aside>

      <section class="panel preview-panel">
        <div class="pv-resizer" id="pv-resizer" title="Arraste para redimensionar o preview"></div>
        <div class="preview-stage" id="preview-stage">
          <div class="preview-frame" id="preview-frame">
            <canvas id="preview-canvas"></canvas>
            <div id="preview-overlay"></div>
          </div>
        </div>
        <div class="transport">
          <button data-action="to-start" data-icon="toStart" class="icon" title="Início (Home)" aria-label="Início"></button>
          <button data-action="prev-frame" data-icon="prev" class="icon" title="Frame anterior (←)" aria-label="Frame anterior"></button>
          <button data-action="play" data-icon="play" id="play-btn" class="play" title="Play/Pausa (Espaço)" aria-label="Play/Pausa"></button>
          <button data-action="next-frame" data-icon="next" class="icon" title="Próximo frame (→)" aria-label="Próximo frame"></button>
          <button data-action="to-end" data-icon="toEnd" class="icon" title="Fim (End)" aria-label="Fim"></button>
          <span class="timecode"><span id="tc-current">00:00.00</span> / <span id="tc-total">00:00.00</span></span>
        </div>
      </section>

      <aside class="panel" id="inspector"></aside>

      <!-- workspace de motion design: ocupa o lugar do preview, do inspector e da timeline -->
      <section class="panel motion-stage-panel motion-only" id="motion-stage-panel"></section>
      <aside class="panel motion-only" id="motion-inspector"></aside>
    </main>

    <section class="timeline" id="timeline"></section>
    <section class="timeline motion-only" id="motion-timeline"></section>

    <div id="modal-root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
